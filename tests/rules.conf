# ============================================================================
#  线程归位规则 v1.4 —— 一加15 / SM8850 / 王者荣耀 165fps 实测重排
# ----------------------------------------------------------------------------
#  格式： <包名|*>  <线程名 POSIX ERE>  <目标>
#
#  目标可以是一个核掩码，也可以用 '+' 组合「掩码 + hmbird 调度属性」：
#     prime=CPU6-7  prime1=CPU7  prime2=CPU6  perf=CPU0-5  mid=CPU4-5
#     low=CPU0-3    bg=CPU0-1
#     preempt          —— hmbird 偏好抢占（延迟敏感的串行线程）
#     idle             —— hmbird 偏好空闲核（音频这类可以晚一点的线程）
#     uclamp:1..1024   —— 直接写 hmbird 的 per-task uclamp_max，按 1024=100%
#   例： prime1+preempt / perf+uclamp:640 / low+idle
#
#  解析规则（改之前先看，否则规则会被静默丢弃）：
#   1. 最后一个空白分隔字段是「目标」，中间整段都是正则 —— 正则里可以带空格，
#      这样 ^Job\.worker 才能覆盖内核 comm 为 "Job.worker 0/1" 的线程。
#   2. POSIX ERE，不是 PCRE：\d \s \b 全部无效（\d 在 glibc 下是字面 "d"）。
#   3. 每条都锚 ^...$：以前写 `UnityGfx` 是前缀匹配，把 UnityGfxDeviceW 一起拉进超大核。
#
#  为什么这么分（依据 600s 实测）：
#   * UnityMain + UnityGfxDeviceW 是**串行链**：同一帧里先后跑。基准 5.089ms/帧，
#     v1.1 变成 6.105ms/帧、43% 的秒数超过 6.06ms 预算（基准 2.8%）；两个超大核
#     峰值只用到 145.5%/200% —— 不是缺核，是被挤在一起排队。所以两段各钉一颗大核。
#   * CPU0-5 同属一个 policy（同频），把线程从 0-5 收到 0-1 省不到频率，只是更挤。
#   * hmbird 的 coefficient / freq_policy 在内核里只导出给 BPF，没有实现体，
#     能精确控制的只有 prefer_* 与 set_uclamp —— 所以本文件只写这三类。
# ============================================================================

# —— 串行链：两段分核 + 抢占优先 ——
* ^UnityMain$                                        prime1+preempt
* ^UnityGfxDeviceW$                                  prime2+preempt

# —— 渲染工作线程：只收到同簇中段，别跟主线程抢超大核 ——
* ^GfxRenderWorker$                                  mid

# —— Unity 并行 Job：纯吞吐，靠完成信号同步。给 62% 的 uclamp 上限，
#    这样它们跑得再满也不会把整个簇的频率需求顶上去（省电的主要来源）——
* ^Job\.worker                                       perf+uclamp:640

# —— 引擎其它固定线程 ——
* ^CoreThread$|^NativeThread$                        perf

# —— 音频 / 网络：宁可慢一点也不抢渲染核 ——
* ^AudioTrack$|^AudioOut_[0-9]|^AAudio|^AudioThread  low+idle
* ^audioserver$|^AudioFlinger$                       low+idle
* ^Network|^Socket|^NetThread|^HttpThread            low

# —— 加载 / IO ——
* ^Loading|AsyncLoading|TaskGraphThread|FileIO       perf

# —— 脚本 VM ——
* ^Scripting|^Lua|^V8                                perf

# —— 未知线程（Thread-xxxx 这类）故意不写规则 ——
#    容量够（两核峰值 145%/200%），乱绑只会把热线程挪到更差的核；
#    留在 0-7 由 hmbird 自己判，比按名字瞎猜安全。

# —— 单款游戏的私有线程（包名精确匹配优先级最高，按需启用）——
# com.tencent.tmgp.sgame  ^LogicThread$  prime2+preempt
