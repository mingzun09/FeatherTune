# ============================================================================
#  羽量调校 FeatherTune · 配置文件（改完在 WebUI 点保存即可，无需重启）
#  OnePlus 15 / SM8850：2×Oryon Prime(4.6G) + 6×Oryon Performance(3.6G)
# ============================================================================

# 总开关：0=完全停手并还原，1=工作
enable=1

# 场景模式：auto(自动识别) / daily(均衡) / battery(省电) / game(游戏) / perf(满速) / sleep(熄屏强度)
mode=auto

# 省电强度 0-100：50 为基准，越大频率上限压得越低（仅影响日常场景，游戏不压）
intensity=50

# 低电量(<=20%)且未充电时自动切 battery
auto_game=1

# 熄屏后压到 sleep 档（挂机下载/听歌会略慢，介意可关）
screen_off_saver=1

# 游戏线程归位（渲染/主线程分簇；hmbird 激活时走它自己的接口）
thread_opt=1

# 关掉厂商的触控/输入加速
kill_boost=1

# UFS 预读 & iostats
io_tune=1

# GPU 侧省电（force_clk_on/bus_split；不动频率表）
gpu_tune=1

# 切换/启动 App 后短暂放开上限
launch_boost=1
boost_ms=4000

# 日志详细度 0=静默 1=关键 2=详细
log_level=1

# --- 游戏场景：频率地板（v1.2 新增）--------------------------------------
# 实测王者荣耀 165fps：perf 簇 p50 只有 787MHz 时，19~30ms 长尾从 7 秒涨到 45 秒。
# 给一个地板把 384/537MHz 的深谷掐掉，比整体抬上限更省电也更稳。
# 0 = 不设地板
game_min_pct=42

# 游戏时把 background cgroup 收到 0-3，别让后台线程插进超大核
game_bg_cpus=1

# --- 风驰(hmbird) 协同参数 ----------------------------------------------
# hmbird_tune=1 才会改 coefficient/perf_high_ratio/heavy_boost/apply_freq_immediately。
# v1.2 默认改成 0：实测把系数往 1152 调后，perf 簇 p50 掉到 787MHz、长尾翻 6 倍，
# 说明方向假设错了。要自己 A/B 再打开。
# 游戏档策略（实测结论见 docs/HMBIRD.md 第 7 节）
#   official   —— 频率/调度/线程全部交给系统，模块什么都不写（默认）
#   light      —— 只把 frame_per_sec 对齐面板刷新率，其余不动
#   aggressive —— 抬频率地板 + 绑核 + Job 压 uclamp（v1.2.7 的行为，实测比官方差）
game_mode=official

hmbird_tune=0
hmbird_coeff=1152,1024
hmbird_high_ratio=56,60
hmbird_reserved=192
hmbird_heavy=0,360,128

# 帧率窗口对齐（纯收益）：0=自动读面板刷新率，>0=固定值，-1=不动
hmbird_frame_per_sec=0

# --- 充电控制（方案 A：只降不升，不碰温度上报）--------------------------
# SOC 低于拐点时完全不干预（这段厂商曲线自己跑）；
# 超过拐点后按电池温度查表降电流上限，温度到墙直接暂停充电。
# curve 格式 "温度:电流百分比"，按温度升序，取最后一个 <= 当前温度的点。
charge_ctrl=1
# 0~67% 电量区间：完全不动，让原厂 120W 跑满
charge_knee_soc=67
# 温度墙：到 50℃ 降一档（120W→90W），52℃ 再降（→60W），54℃ 才暂停
charge_temp_wall=50
charge_resume_temp=45
# 67% 之后的温度→电流曲线，与温度阶梯取更低者
charge_curve=36:100,38:88,40:78,42:66,44:55,50:50,43:0
