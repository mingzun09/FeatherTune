# ============================================================================
#  羽量调校 FeatherTune · 配置文件（改完在 WebUI 点保存即可，无需重启）
#  OnePlus 15 / SM8850：2×Oryon Prime(4.6G) + 6×Oryon Performance(3.6G)
# ============================================================================

# 总开关：0=完全停手并还原，1=工作
enable=1

# 场景模式：auto(自动识别) / daily(均衡) / battery(省电) / game(游戏) / perf(满速) / sleep(熄屏强度)
mode=auto

# 省电强度 0-100：50 为基准，越大频率上限压得越低（仅影响日常场景，游戏不压）
intensity=50

# 低电量(<=20%)且未充电时自动切 battery
auto_game=1

# 熄屏后压到 sleep 档（挂机下载/听歌会略慢，介意可关）
screen_off_saver=1

# 游戏线程归位（渲染/主线程分簇；hmbird 激活时走它自己的接口）
thread_opt=1

# 关掉厂商的触控/输入加速
kill_boost=1

# UFS 预读 & iostats
io_tune=1

# GPU 侧省电（force_clk_on/bus_split；不动频率表）
gpu_tune=1

# 切换/启动 App 后短暂放开上限
launch_boost=1
boost_ms=4000

# 日志详细度 0=静默 1=关键 2=详细
log_level=1

# --- 游戏场景：频率地板（v1.2 新增）--------------------------------------
# 实测王者荣耀 165fps：perf 簇 p50 只有 787MHz 时，19~30ms 长尾从 7 秒涨到 45 秒。
# 给一个地板把 384/537MHz 的深谷掐掉，比整体抬上限更省电也更稳。
# 0 = 不设地板
game_min_pct=42

# 游戏时把 background cgroup 收到 0-3，别让后台线程插进超大核
game_bg_cpus=1

# --- 风驰(hmbird) 协同参数 ----------------------------------------------
# hmbird_tune=1 才会改 coefficient/perf_high_ratio/heavy_boost/apply_freq_immediately。
# v1.2 默认改成 0：实测把系数往 1152 调后，perf 簇 p50 掉到 787MHz、长尾翻 6 倍，
# 说明方向假设错了。要自己 A/B 再打开。
# 游戏档策略（实测结论见 docs/HMBIRD.md 第 7 节）
#   official   —— 频率/调度/线程全部交给系统，模块什么都不写（默认）
#   light      —— 只把 frame_per_sec 对齐面板刷新率，其余不动
#   aggressive —— 抬频率地板 + 绑核 + Job 压 uclamp（v1.2.7 的行为，实测比官方差）
game_mode=official

hmbird_tune=0
hmbird_coeff=1152,1024
hmbird_high_ratio=56,60
hmbird_reserved=192
hmbird_heavy=0,360,128

# 帧率窗口对齐（纯收益）：0=自动读面板刷新率，>0=固定值，-1=不动
hmbird_frame_per_sec=0

# --- 充电控制（方案 A：只降不升，不碰温度上报）--------------------------
# SOC 低于拐点时完全不干预（这段厂商曲线自己跑）；
# 超过拐点后按电池温度查表降电流上限，温度到墙直接暂停充电。
# curve 格式 "温度:电流百分比"，必须按温度升序；乱序点会被忽略，百分比钳在 20~100。
#
# 节点选择（v1.4.1 按内核源码重排）：
#   OnePlus 15 是 charger v2（oplus,chg_framework_v2），它的 battery power_supply
#   只把 CURRENT_NOW 标成可写（oplus_chg_gki.c: battery_psy_prop_is_writeable），
#   并不存在 constant_charge_current_max / current_max / input_suspend 这些老节点。
#   所以本机实际走的是 /sys/class/power_supply/battery/current_now：
#   kernel 把它当成 HIDL_VOTER 的电流上限，并且 **只在息屏（led_on=0）时生效**，
#   亮屏时写它等于取消限流。模块因此只在熄屏时接管，亮屏自动释放、交还厂商 HAL。
charge_ctrl=1
# 0~67% 电量区间：完全不动，让原厂 120W 跑满
charge_knee_soc=67
# 温度墙：到 50℃ 降一档（120W→90W），52℃ 再降（→60W），54℃ 才暂停
charge_temp_wall=50
charge_resume_temp=45
# 67% 之后的温度→电流曲线，与温度阶梯取更低者
# 注意：v1.2.6 的默认值末尾多了一个 ",43:0"，它会让 43℃ 以上全部算成 0%（等于停充）。
# 已删除；旧配置里的这个尾巴也会在加载/升级时被清掉。
charge_curve=36:100,38:88,40:78,42:66,44:55,50:50

# 电芯串联数：0 = 自动（先读 DT oplus,batt_num，一加15 是 2；
# 读不到才退回 voltage_max>6V 的老办法）。1 = 按单芯算。
# charger v2 的 VOLTAGE_MAX 返回的是单芯上限（~4.5V），靠它判 2S 会让功率少算一半。
battery_cells=0

# 1 = 守护进程把自己钉在性能簇（cpu0-5），1Hz 轮询不唤醒超大核；
#     子进程（dumpsys/pm）也继承，同样不会把 cpu6-7 拉出低频。
#     想排查调度问题时设 0（守护进程跟随系统任意调度）。
daemon_pin=1

# --- 充电加速（v1.3.1，按内核源码修正）---------------------------------
# 原理：UFCS/PPS 的电流不是按“降额等级”给的，而是按「温度分桶曲线」给的
#       (vendor/oplus/kernel/charger/v2/strategy/oplus_strategy_pps_ufcs_curve.c)。
#       puc_get_temp_region() 取 temp < 边界[i] 的上一段 → 6 段
#       little_cold / cool / little_cool / normal_low / normal_high / warm，
#       最高电流在 normal_high 段。温度一旦进 warm，曲线整体降流。
#       内核里能改的温度有两个 module_param：
#         oplus_dbg_tbat   (v2 oplus_chg_comm.c) = 机身温度 shell_temp ← 本模块用它
#         gauge_dbg_tbat   (gauge)               = 电池温度（会把保护一起骗，默认不用）
#
# 一加15 的真机 DT（oplus-chg-24831.dtsi）是：
#   oplus,temp_range = <0 50 120 160 210 380 440>   → normal_high = 210~379 (21.0~37.9℃)
# 也就是说常温机身（~29℃）本来就在 normal_high 段，伪装到 22.0℃ 不会有任何增益；
# 只有机身被晒热/边充边玩进到 warm(38℃+) 时，这条伪装才会把曲线拉回最高电流档。
# 读不到 DT 时才退回 25.0℃，此时需要按机型手调 accel_tbat（150~340）。
accel_ctrl=1
# 0 = 自动（按 DT 分桶表算，推荐）；>0 = 手动指定，单位 0.1℃（150~340）
accel_tbat=0
# 真实电池温度到这条线就退出伪装（默认 45℃），回落到 resume 才恢复
accel_stop_temp=45
accel_resume_temp=42
# 温和档：整体把伪装值抬 2℃（仍尽量留在同一段内）
accel_gentle=0
# 1 = 允许在只有 gauge_dbg_tbat 的机器上伪装「电池温度」
#     注意：这会把电池保护也一起骗掉（我们的 45℃ 闸读的就是被改写的值），默认关
accel_gauge=0
