# ============================================================================
#  apps.conf —— 应用级策略（WebUI「应用」页会自动维护这个文件）
# ----------------------------------------------------------------------------
#  格式： <包名> <模式> <性能簇上限%> <超大核上限%> <地板%> <线程规则0|1>
#  模式： game=游戏档 / battery=省电档 / daily=日常档 / perf=满血档
#         custom=完全自定义（用后面四个数字）/ follow=跟随场景（=删掉这一行）
#
#  语义：命中包名的应用**脱离场景**，按这里的策略执行——等于白名单。
#        手机在自动模式下也不会被改回去；想恢复自动就删掉该行。
#  注意：地板% 是 scaling_min_freq 的下限，设太高会持续耗电，只在需要
#        稳定帧时间的应用上开（例如竞技类游戏）。
# ============================================================================

# 示例（默认不启用，去掉行首 # 即可）
# com.tencent.tmgp.sgame      game    100 100 42 1
# com.tencent.mm              battery  60  55  0 0
# com.netease.cloudmusic      custom   70  60 20 0
