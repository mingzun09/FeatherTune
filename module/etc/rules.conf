# ============================================================================
#  线程归位规则 v1.3 —— 一加15 / SM8850 / 王者荣耀 165fps 实测重排
# ----------------------------------------------------------------------------
#  格式： <包名|*>  <线程名 POSIX ERE>  <目标>
#  目标： prime=CPU6-7   prime1=CPU7   prime2=CPU6
#         perf=CPU0-5    mid=CPU4-5    low=CPU0-3    bg=CPU0-1
#
#  解析规则（改之前先看这三条，否则规则会被静默丢弃）：
#   1. 最后一个空白分隔字段是「目标」，中间整段都是正则 —— 所以正则里可以带空格，
#      `^Job\.worker` 才能覆盖内核 comm 为 "Job.worker 0/1" 的线程。
#   2. POSIX ERE，不是 PCRE：\d \s \b 全部无效（\d 在 glibc 下等于字面 "d"）。
#      数字一律写 [0-9]。
#   3. 每条都锚 ^...$：以前写 `UnityGfx` 是前缀匹配，把 UnityGfxDeviceW
#      一起拉进了超大核，和主线程抢同一簇。
#
#  为什么这么分（依据 600s 实测）：
#   * UnityMain + UnityGfxDeviceW 是**串行链**：同一帧里先后跑。
#     基准 5.089ms/帧；v1.1 变成 6.105ms/帧，43% 的秒数超过 6.06ms 预算（基准 2.8%）。
#     两个超大核峰值只用到 145.5%/200% —— 不是缺核，是被挤在一起排队。
#     所以两段各钉一颗大核：主线程 CPU7、图形设备 CPU6。
#   * prefer_cluster 只能表达「哪个簇」，做不到分核；单核目标会走 prefer_cpu。
#   * CPU0-5 同属一个 policy（同频），把线程从 0-5 收到 0-1 省不到频率，只是更挤，
#     所以本文件不用 bg；low 只给「宁可慢也不能抢渲染核」的音频/网络。
# ============================================================================

# —— 串行链：两段分核，谁都不排在谁后面 ——
* ^UnityMain$                                        prime1
* ^UnityGfxDeviceW$                                  prime2

# —— 渲染工作线程：厂商基准不限核，这里只收到同簇的中段，留 A/B 余地 ——
* ^GfxRenderWorker$                                  mid

# —— Unity 并行 Job（纯吞吐，靠完成信号同步，不占超大核）——
* ^Job\.worker                                       perf

# —— 引擎其它固定线程 ——
* ^CoreThread$|^NativeThread$                        perf

# —— 音频：不抢渲染核 ——
* ^AudioTrack$|^AudioOut_[0-9]|^AAudio|^AudioThread  low
* ^audioserver$|^AudioFlinger$                       low

# —— 加载 / IO ——
* ^Loading|AsyncLoading|TaskGraphThread|FileIO       perf

# —— 网络 / 脚本 ——
* ^Network|^Socket|^NetThread|^HttpThread            low
* ^Scripting|^Lua|^V8                                perf

# —— 未知线程（Thread-xxxx 这类）故意不写规则 ——
#    容量够（两核峰值 145%/200%），乱绑只会把热线程挪到更差的核；
#    留在 0-7 由 hmbird 自己判，比按名字瞎猜安全。

# —— 单款游戏的私有线程（包名精确匹配优先级最高，按需启用）——
# com.tencent.tmgp.sgame  ^LogicThread$  prime2
